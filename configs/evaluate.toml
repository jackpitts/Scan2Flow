# Proposed backend contract; use --checkpoint, --split, and --output on the CLI.
schema_version = "0.1.0"

[dataset]
asset_paths_relative_to = "manifest_directory"
validation_manifest = "data/manifests/validation.jsonl"
test_manifest = "data/manifests/test.jsonl"
record_schema = "schemas/dataset-record.schema.json"
require_asset_checksums = true
require_known_scale = true

[preprocessing]
source = "checkpoint_bundle"
expected_version = "geometry-v1-proposed"
reject_version_mismatch = true
augmentation = false

[evaluation]
seed = 42
surface_sample_count = 10000
distance_unit = "m"
fscore_distance_m = 0.001
alignment = "recorded_rigid_transform_only"
allow_scale_alignment = false
metrics = ["symmetric_chamfer_l1_m", "hausdorff95_m", "fscore", "normal_consistency", "dimension_relative_error", "valid_brep_rate", "watertight_rate", "abstention_rate"]
report_slices = ["modality", "family_id", "sensor", "occlusion", "material"]
bootstrap_resamples = 1000
bootstrap_group = "family_id"
confidence_level = 0.95
missing_annotation_policy = "report_unavailable"

[promotion]
enabled = false
threshold_status = "unset_requires_case_validation"
missing_metric_policy = "fail"
require_case_review = true
require_threshold_policy = true
require_baseline_comparison = true
require_slice_review = true
require_geometry_review = true
